<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Burndown del Sprint 2</title>
  <desc id="desc">Se planearon 18 puntos entre el 2 y el 15 de noviembre de 2026. La línea ideal baja de 18 a 0. La línea real permanece en 18 hasta el 8 de noviembre, cuando HU07 resta 5 puntos, y cierra en 13 puntos pendientes.</desc>
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="58" y="34" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#142537">Sprint 2 · trabajo restante</text>
  <text x="58" y="58" font-family="Arial,sans-serif" font-size="13" fill="#4a5a69">2–15 de noviembre de 2026 · 18 PHU comprometidos</text>
  <g stroke="#dce3e8" stroke-width="1">
    <line x1="78" y1="90" x2="696" y2="90"/>
    <line x1="78" y1="160" x2="696" y2="160"/>
    <line x1="78" y1="230" x2="696" y2="230"/>
    <line x1="78" y1="300" x2="696" y2="300"/>
    <line x1="78" y1="370" x2="696" y2="370"/>
  </g>
  <g stroke="#465765" stroke-width="2">
    <line x1="78" y1="90" x2="78" y2="370"/>
    <line x1="78" y1="370" x2="696" y2="370"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="13" fill="#465765">
    <text x="45" y="95">18</text><text x="45" y="165">13</text><text x="45" y="235">9</text><text x="45" y="305">4</text><text x="52" y="375">0</text>
    <text x="68" y="394">2 nov</text><text x="212" y="394">5 nov</text><text x="354" y="394">8 nov</text><text x="496" y="394">11 nov</text><text x="648" y="394">15 nov</text>
    <text x="314" y="424">Fecha de cierre</text>
  </g>
  <path d="M78 90 L696 370" fill="none" stroke="#758fa8" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M78 90 L362 90 L362 160 L696 160" fill="none" stroke="#b14c31" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="362" cy="160" r="6" fill="#b14c31"/>
  <circle cx="696" cy="160" r="6" fill="#b14c31"/>
  <text x="374" y="148" font-family="Arial,sans-serif" font-size="13" fill="#8e371f">HU07 completada: −5 PHU</text>
  <text x="576" y="148" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#8e371f">13 pendientes</text>
  <g font-family="Arial,sans-serif" font-size="13" fill="#233648">
    <line x1="482" y1="39" x2="518" y2="39" stroke="#758fa8" stroke-width="3" stroke-dasharray="8 6"/><text x="525" y="44">Ideal</text>
    <line x1="586" y1="39" x2="622" y2="39" stroke="#b14c31" stroke-width="4"/><text x="629" y="44">Real</text>
  </g>
</svg>
