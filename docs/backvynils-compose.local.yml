name: backvynils

services:
  web:
    build:
      context: ../../BackVynils
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: vinyls
      USE_SSL: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: vinyls
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vinyls"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - vinyls_data:/var/lib/postgresql/data

volumes:
  vinyls_data:
